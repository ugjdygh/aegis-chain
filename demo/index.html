<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080d13">
<meta name="color-scheme" content="dark">
<title>Aegis Chain · 手机演示</title>
<style>
  :root{--bg:#080d13;--panel:#111a24;--line:#1e2b39;--text:#e7eef7;--dim:#8598ab;--cyan:#38d3c0;--amber:#f2c14e;--green:#4ade80;--red:#ef6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(800px 460px at 15% -10%,#122430 0%,transparent 60%),var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    overscroll-behavior-y:contain}
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-size:16px;margin:0}
  .badge-demo{font-size:10.5px;color:var(--amber);border:1px solid #5f5027;background:#1b1709;border-radius:99px;padding:2px 8px}
  .langs{margin-left:auto;display:flex;gap:4px}
  .langs button{font:inherit;font-size:12px;min-height:34px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:#0f1721;color:var(--dim)}
  .langs button.on{background:#173430;border-color:#2b6b62;color:var(--cyan)}
  .tabs{display:flex;gap:6px;margin-top:12px}
  .tabs button{flex:1;font:inherit;font-size:14px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0c141c;color:var(--dim)}
  .tabs button.on{border-color:#2b6b62;color:var(--cyan);background:#0f2523}
  .card{background:linear-gradient(180deg,var(--panel),#0c141c);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:11px}
  h2{font-size:12px;color:var(--dim);margin:0 0 10px;letter-spacing:.8px;font-weight:600;display:flex;align-items:center;gap:7px}
  h2::before{content:"";width:3px;height:11px;border-radius:2px;background:var(--amber)}
  form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  input,select,button{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0c141c;color:var(--text);min-width:0}
  form button{grid-column:span 2;min-height:48px;border-color:#2b6b62;color:var(--cyan);background:#0f2523}
  .inv{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#0b1219;font-size:12px}
  .inv .top{display:flex;align-items:center;gap:8px}
  .inv .id{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--dim)}
  .st{margin-left:auto;font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .st.confirming{color:var(--amber);border-color:#5f5027;background:#1b1709}
  .st.confirmed{color:var(--green);border-color:#2f6146;background:#0e2018}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 10px;margin-top:6px;color:var(--dim);font-size:11.5px;word-break:break-all}
  .kv b{color:var(--text);font-weight:500}
  .paybtn{width:100%;margin-top:8px;min-height:44px;border-color:#5f5027;color:var(--amber);background:#1a1709;font-size:15px}
  .empty{color:var(--dim);font-size:12px}
  .amount{font-size:34px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
  .asset{text-align:center;color:var(--cyan);font-size:14px}
  .chain{text-align:center;color:var(--dim);font-size:11.5px;margin-top:4px}
  .addr{margin-top:12px;font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);word-break:break-all;background:#0b1219;border:1px solid var(--line);border-radius:10px;padding:10px}
  .row{display:flex;gap:8px;margin-top:10px}
  .row button{flex:1;min-height:48px;border-color:#2b6b62;color:var(--cyan);background:#0f2523}
  .steps{margin-top:12px;display:flex;gap:6px}
  .step{flex:1;text-align:center;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:9px;padding:8px 4px}
  .step.on{border-color:#2b6b62;color:var(--cyan);background:#0f2321}
  .hint{color:var(--dim);font-size:11.5px;margin-top:10px;line-height:1.65}
  footer{color:#5a6b7b;font-size:10.5px;margin-top:14px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="t-title">Aegis Chain</h1>
    <span class="badge-demo" id="t-demo">演示环境</span>
    <div class="langs"><button data-lang="zh" class="on">中文</button><button data-lang="en">EN</button></div>
  </header>

  <div class="tabs">
    <button id="tab-console" class="on" type="button">控制台</button>
    <button id="tab-pay" type="button">收银台</button>
  </div>

  <!-- ===== 控制台 ===== -->
  <section id="view-console">
    <div class="card">
      <h2 id="t-new">新建收款单</h2>
      <form id="form">
        <select id="f-chain"><option value="demo">Demo Chain</option><option value="base-sepolia">Base Sepolia</option><option value="tron">TRON</option></select>
        <select id="f-asset"><option>USDC</option><option>ETH</option></select>
        <input id="f-amount" value="25" inputmode="decimal" placeholder="25">
        <input id="f-order" placeholder="order-1001">
        <button type="submit" id="t-create">生成收款地址</button>
      </form>
      <div class="hint" id="t-formnote"></div>
    </div>

    <div class="card">
      <h2 id="t-inv">收款单</h2>
      <div id="invs"><div class="empty" id="t-empty">暂无收款单</div></div>
    </div>
  </section>

  <!-- ===== 收银台 ===== -->
  <section id="view-pay" style="display:none">
    <div class="card">
      <div class="amount" id="p-amount">—</div>
      <div class="asset" id="p-asset"></div>
      <div class="chain" id="p-chain"></div>
      <div class="addr" id="p-addr">—</div>
      <div class="row"><button id="p-copy" type="button">复制地址</button><button id="p-open" type="button">在钱包中打开</button></div>
      <div class="steps" id="p-steps">
        <div class="step" data-s="pending">待支付</div>
        <div class="step" data-s="confirming">确认中</div>
        <div class="step" data-s="confirmed">已到账</div>
      </div>
      <div class="hint" id="t-payhint"></div>
    </div>
  </section>

  <footer id="t-foot"></footer>
</div>

<script>
const L = {
  zh:{title:'Aegis Chain',demo:'演示环境',new:'新建收款单',create:'生成收款地址',inv:'收款单',empty:'暂无收款单',
    formnote:'演示：不会真实转账。点收款单上的「模拟到账」可走完整确认流程。真实链入账需在 Termux 里跑网关。',
    payhint:'收款状态会自动推进：模拟到账 → 确认中 → 已到账（演示用 2 个确认）。',
    foot:'这是手机端演示版：数据只在浏览器内。完整版跑在 Termux / 服务器上，接真实链与回调。',
    copy:'复制地址',open:'在钱包中打开',copied:'已复制',simulate:'模拟到账',chain:'链',asset:'资产',amount:'金额',
    tabConsole:'控制台',tabPay:'收银台',
    step:{pending:'待支付',confirming:'确认中',confirmed:'已到账'}},
  en:{title:'Aegis Chain',demo:'Demo mode',new:'New invoice',create:'Generate address',inv:'Invoices',empty:'No invoices yet',
    formnote:'Demo only: no real transfer. Tap “Simulate deposit” to walk through confirmations. Real-chain intake needs the gateway running in Termux.',
    payhint:'Status advances automatically: simulated deposit → confirming → paid (2 confirmations in demo).',
    foot:'Mobile demo: state lives in this browser only. Full build runs in Termux or on a server with real chains and webhooks.',
    copy:'Copy address',open:'Open in wallet',copied:'Copied',simulate:'Simulate deposit',chain:'chain',asset:'asset',amount:'amount',
    tabConsole:'Console',tabPay:'Checkout',
    step:{pending:'awaiting',confirming:'confirming',confirmed:'paid'}},
};
let lang = (navigator.language||'zh').slice(0,2)==='zh'?'zh':'en';
const $ = id => document.getElementById(id);
const t = k => L[lang][k] ?? k;

/* ===== 演示用内存网关：开单 / 模拟到账 / 确认推进 ===== */
const DB = { invoices: [], seq: 0 };
const ADDRS = [
  '0x94200cd56fc6346b8b555c653fc8227cfbc297f8',
  '0x7c2c1a4d5e6f708192a3b4c5d6e7f8091a2b3c4d',
  '0x5b4a3c2d1e0f9081726354453423120f1e2d3c4b',
];
/* TRON 地址是 base58check（"T" 开头，34 字符），不是 0x 十六进制。
   这三个由 0x41+hex 经 sha256d 推导并逐个反向校验过，不要手写。 */
const TRON_ADDRS = [
  'TPURQLDRv6oGrKZdSteSpVFa5GfcHdmTNV',
  'TMHmdA8hyXfKDoxAb9rpwW4dj8jEmoc44h',
  'TJHuRTXdyuroaCHMNfdDd211WT1caXxvc8',
];
function newInvoice(chain, asset, amount, order){
  DB.seq++;
  const pool = chain==='tron' ? TRON_ADDRS : ADDRS;
  const inv = {
    id: 'inv_demo' + DB.seq.toString().padStart(4,'0'),
    chainKey: chain, chainId: chain==='demo'?20270:chain==='tron'?728126428:84532,
    asset, amount: String(amount||'25'), orderId: order || '',
    address: pool[(DB.seq-1) % pool.length],
    status: 'pending', conf: 0, req: chain==='demo'?2:5,
  };
  DB.invoices.unshift(inv);
  return inv;
}
function simulate(inv){
  if(inv.status !== 'pending') return;
  inv.status = 'confirming'; inv.conf = 0;
  render();
  const timer = setInterval(() => {
    inv.conf++;
    if(inv.conf >= inv.req){ inv.status = 'confirmed'; clearInterval(timer); }
    render();
  }, 2200);
}

function tracked(){ return DB.invoices[0] || null; }

function label(s){ return (L[lang].step||{})[s] || s; }

function render(){
  /* 列表 */
  $('invs').innerHTML = DB.invoices.length ? DB.invoices.map(i => `
    <div class="inv">
      <div class="top"><span class="id">${i.id}</span><span class="st ${i.status}">${label(i.status)}</span></div>
      <div class="kv">
        <span>${t('chain')}: ${i.chainKey} · ${i.chainId}</span>
        <span>${t('amount')}: <b>${i.amount} ${i.asset}</b></span>
        <span style="grid-column:span 2">${i.address}</span>
        <span>conf ${i.status==='pending'?0:i.conf}/${i.req}</span>
      </div>
      ${i.status==='pending' ? `<button class="paybtn" data-pay="${i.id}" type="button">${t('simulate')}</button>`:''}
    </div>`).join('') : `<div class="empty">${t('empty')}</div>`;

  $('invs').querySelectorAll('[data-pay]').forEach(b=>{
    b.onclick = () => { const inv = DB.invoices.find(x=>x.id===b.dataset.pay); if(inv) simulate(inv); openPay(inv.id); };
  });

  /* 收银台：必须画「屏幕上这一张」(currentInv)，不是「最新一张」(tracked())。
     原实现 openPay(id) 只设置 currentInv 却从不读它，于是点列表里的第 1 张单，
     收银台显示的是第 2 张单的地址和金额。 */
  const inv = currentInv || tracked();
  if(inv){
    $('p-amount').textContent = inv.amount;
    $('p-asset').textContent = inv.asset;
    $('p-chain').textContent = inv.chainKey + ' · chainId ' + inv.chainId;
    $('p-addr').textContent = inv.address;
    document.querySelectorAll('.step').forEach(el => el.classList.toggle('on', el.dataset.s === inv.status));
  }
}

/* ===== 视图切换 ===== */
let currentInv = null;
function openPay(id){
  currentInv = DB.invoices.find(i=>i.id===id) || null;
  $('view-console').style.display='none'; $('view-pay').style.display='';
  $('tab-console').classList.remove('on'); $('tab-pay').classList.add('on');
  render();
}
$('tab-console').onclick = () => {
  $('view-console').style.display=''; $('view-pay').style.display='none';
  $('tab-console').classList.add('on'); $('tab-pay').classList.remove('on');
};
$('tab-pay').onclick = () => openPay(tracked()?.id);

$('form').onsubmit = (e) => {
  e.preventDefault();
  const inv = newInvoice($('f-chain').value, $('f-asset').value, $('f-amount').value, $('f-order').value);
  $('f-order').value = '';
  render(); openPay(inv.id);
};

$('p-copy').onclick = async () => {
  try{ await navigator.clipboard.writeText(tracked()?.address || ''); $('p-copy').textContent = t('copied');
    setTimeout(()=>$('p-copy').textContent = t('copy'), 1500); }catch(e){}
};
/* 深链按链生成。EIP-681（ethereum:）只适用于 EVM；TRON 用自己的 tron: 形式。
   地址必须取 currentInv —— 与收银台显示的同一张单。 */
function walletUri(inv){
  if(!inv || !inv.address) return null;
  if(inv.chainKey === 'tron') return 'tron:' + inv.address;
  return 'ethereum:' + inv.address + '@' + inv.chainId;
}
$('p-open').onclick = () => {
  const inv = currentInv || tracked();
  const a = inv?.address; if(!a) return;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);
  const uri = walletUri(inv);
  /* TRON 钱包直接吃 tron: scheme，不要走 MetaMask 的 intent 跳转。 */
  if(inv.chainKey === 'tron'){ location.href = uri; return; }
  if(isIOS){ location.href = 'https://metamask.app.link/dapp/' + location.host; return; }
  if(isAndroid){
    location.href = `intent://${location.host}#Intent;scheme=https;package=io.metamask;S.browser_fallback_url=${encodeURIComponent(location.href)};end`;
    setTimeout(()=>{ if(document.visibilityState==='visible') location.href = uri; }, 800);
    return;
  }
  location.href = uri;
};

function setLang(l){
  lang = l;
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on', b.dataset.lang===l));
  document.documentElement.lang = l==='zh'?'zh-CN':'en';
  $('t-title').textContent = t('title'); $('t-demo').textContent = t('demo');
  $('t-new').textContent = t('new'); $('t-create').textContent = t('create');
  $('t-inv').textContent = t('inv'); $('t-formnote').textContent = t('formnote');
  $('t-payhint').textContent = t('payhint'); $('t-foot').textContent = t('foot');
  $('p-copy').textContent = t('copy'); $('p-open').textContent = t('open');
  $('tab-console').textContent = t('tabConsole'); $('tab-pay').textContent = t('tabPay');
  render();
}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

newInvoice('demo','USDC','25','demo-0001');
setLang(lang);
</script>
</body>
</html>
